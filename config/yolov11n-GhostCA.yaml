nc: 26

scales:
  n: [0.50, 0.25, 1024]

# =========================
# Backbone
# =========================
backbone:
  # Stage 1
  - [-1, 1, Conv, [64, 3, 2]]

  # Stage 2
  - [-1, 1, DynamicGhostConv, [128, 3, 2]]
  - [-1, 3, RecalibratedGhost, [128]]

  # Stage 3
  - [-1, 1, DynamicGhostConv, [256, 3, 2]]
  - [-1, 4, SCDGhostBlock, [256]]

  # Stage 4
  - [-1, 1, DynamicGhostConv, [512, 3, 2]]
  - [-1, 6, SCDGhostBlock, [512]]

  # Stage 5
  - [-1, 1, DynamicGhostConv, [768, 3, 2]]
  - [-1, 3, GhostConv_CA, [768]]

  # High-level feature refinement
  - [-1, 1, SPPF, [768, 5]]
  - [-1, 1, CoordinateAttention, [768]]

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 7], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]]

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C3k2, [256, False]]

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 13], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]]

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 10], 1, Concat, [1]]
  - [-1, 2, C3k2, [768, True]]

  - [[16, 19, 22], 1, Detect, [nc]]