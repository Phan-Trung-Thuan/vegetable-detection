nc: 26

scales:
  n: [0.50, 0.25, 1024]

# =========================
# Backbone
# =========================
backbone:
  # Stage 1
  - [-1, 1, Conv, [64, 3, 2]]

  # Stage 2
  - [-1, 1, GhostConv, [128, 3, 2]]
  - [-1, 3, C3Ghost, [128, True]]

  # Stage 3 (P3 source - IMPORTANT)
  - [-1, 1, GhostConv, [256, 3, 2]]
  - [-1, 4, C3Ghost, [256, True]]   # giảm từ 6 → 4
  - [-1, 1, DWConv, [256, 5, 1]]    # thêm spatial refinement

  # Stage 4
  - [-1, 1, GhostConv, [512, 3, 2]]
  - [-1, 5, C3Ghost, [512, True]]   # giảm nhẹ 6 → 5

  # Stage 5
  - [-1, 1, GhostConv, [768, 3, 2]]
  - [-1, 2, C3k2, [768, True]]      # giảm từ 1024 → 768

  - [-1, 1, SPPF, [768, 5]]
  - [-1, 1, ECA, [768]]

# =========================
# Head
# =========================
head:
  # P5 -> P4
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 7], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]]

  # P4 -> P3
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 4], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, True]]
  - [-1, 1, DWConv, [512, 5, 1]]    # thêm receptive field cho small object
  - [-1, 1, ECA, [512]]             # attention nhẹ cho P3

  # Downsample back to P4
  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 14], 1, Concat, [1]]
  - [-1, 2, C3k2, [512, False]]

  # Downsample to P5
  - [-1, 1, Conv, [768, 3, 2]]
  - [[-1, 11], 1, Concat, [1]]
  - [-1, 2, C3k2, [768, False]]

  # Detect
  - [[16, 20, 23], 1, Detect, [nc]]